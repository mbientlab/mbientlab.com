mmrl:
  name: MetaMotionRL
  short: MMRL
  url: /metamotionrl/
  badge: 9-axis IMU
  tagline: 9-axis IMU and environment monitoring sensor
  lead: A wearable device that offers real-time and continuous monitoring of motion and environmental sensor data.
  headline: Light. Wearable. Rechargeable. Powerful.
  image: metamotion-2.png
  card_image: mmrl-board-only-5.jpg
  card_text: Low-energy 2.4 GHz wireless communication with an ARM Cortex M4 microcontroller, rechargeable battery, accelerometer, gyroscope, magnetometer and sensor fusion.
  bullets:
    - Gyroscope, accelerometer, magnetometer and sensor fusion.
    - Real-time communication is achieved via Bluetooth LE.
    - Data may also be logged in the 8MB NOR flash memory.
    - A water-resistant case can be added to bands and more.
    - Use for motion applications and scientific research.
    - Free, open-source APIs and apps for fast data acquisition.
  quick:
    - { value: "0.2 oz", label: Weight }
    - { value: "27 × 27 × 4 mm", label: In case }
    - { value: "8 MB", label: NOR flash }
    - { value: "BLE 4.0", label: Wireless }
  feature:
    title: 9-axis IMU + Bosch Kalman filter sensor fusion
    text: The sensor fusion algorithm combines inertial and magnetic measurements to provide drift-free orientation.
    image: Board4-updated.png
  specs_intro: Unobtrusive monitoring and clinical quality observation. Record in the lab or at home with no hassle. Obtain accurate and precise sensor data.
  specs_image: mio_sensor_04-730x1024.png
  specs:
    - { icon: feather, label: Weight, value: Ultra lightweight at just 0.2 oz }
    - { icon: clock, label: Synchronized timestamps, value: All data is timestamped for synchronization purposes }
    - { icon: battery, label: LiPo battery, value: "70–100 mAh, micro-USB rechargeable. Charging time: 2 h" }
    - { icon: droplet, label: Splash resistant, value: IP40 plastic case snaps together }
    - { icon: shield, label: Regulatory compliance, value: "CE, FCC, IC, RoHS" }
    - { icon: code, label: Programmable, value: "Swift, C++, Java, JavaScript and Python APIs used to communicate with the device" }
    - { icon: box, label: Miniature form factor, value: "27 mm × 27 mm × 4 mm in case" }
    - { icon: activity, label: Usage modes, value: "Streaming: 8–24 h. Recording: 2–48 h" }
    - { icon: power, label: Low power consumption, value: Sleep mode supports 6 months idle time and 1 week active time }
    - { icon: bluetooth, label: Data transfer, value: Bluetooth Low Energy 4.0 Smart® }
    - { icon: database, label: Flash memory, value: 8MB NOR. Up to 1M data entries }
    - { icon: users, label: Typical usage, value: "Patient monitoring, motion capture, STEM learning and more" }
  sensors_intro: Ideal for monitoring fast moving objects, humans or animals. Great for scientific and patient studies in clinical settings.
  sensors:
    - group: Sensors
      items:
        - name: Gyroscope
          rows: [[Range, "±125, ±250, ±500, ±1000, ±2000 °/s"], [Resolution, 16 bit], [Sample rate, "0.001 Hz – 100 Hz stream, 800 Hz log"]]
        - name: Accelerometer
          rows: [[Range, "±2, ±4, ±8, ±16 g"], [Resolution, 16 bit], [Sample rate, "0.001 Hz – 100 Hz stream, 800 Hz log"]]
        - name: Magnetometer
          rows: [[Range, "±1300 μT (x, y-axis), ±2500 μT (z-axis)"], [Resolution, 0.3 μT], [Sample rate, "0.001 Hz – 25 Hz"]]
        - name: Sensor fusion
          rows: [[Outputs, "Quaternion, Euler angles (yaw, pitch, roll), linear acceleration, Earth acceleration (gravity), robust heading"], [Accuracy, "< 1° RMS"], [Sample rate, 100 Hz]]
    - group: Interfaces
      items:
        - name: IOs
          rows: [[Channels, 2 (with 4 additional SMP IOs under the board)], [Range, 0 V to 3.1 V], [Resolution, 10-bit]]
        - name: Serial
          rows: [[Available, I2C and SPI], [Voltage, 3.0 V]]
        - name: Memory
          rows: [[On-board, Programmable push-button and LED], [Memory, "8MB NOR flash memory – store up to 1M sensor data entries"]]
  develop:
    - Our APIs support Android, iOS, Windows and Linux development. Platforms supported include Xcode, Android Studio and Visual Studio.
    - Our open-source APIs are available in Swift, C++, C#, Java, and JavaScript. Additional documentation, tutorials, and free example apps are available.
  gallery: [metamotionr4.jpg, metamotionr5.jpg]

mms:
