mth:
  name: MetaHub
  short: MTH
  url: /metahub/
  badge: IoT gateway
  tagline: Raspberry Pi based IoT gateway for your MetaSensors
  lead: A powerful and cost-effective solution for large-scale, low-power wireless deployments.
  headline: Simple, flexible IoT connectivity.
  image: metahub-3.jpg
  card_image: metahub-3.jpg
  card_text: Raspberry Pi based Bluetooth to Wi-Fi gateway. Manage multiple MetaSensors locally and graph their data live.
  bullets:
    - Pre-loaded with the Raspbian OS and MetaHub app.
    - Send commands to multiple MetaSensors.
    - Graph sensor data live on the screen.
    - Use our developer tools to build your own app.
    - Includes APIs to simplify connectivity to MetaSensors.
    - Run your own application on the Hub.
    - Reduced latency, local management of MetaSensors.
    - Networking includes Bluetooth LE, Wi-Fi, and LAN.
    - Just plug in a mouse, keyboard, and LCD screen.
  quick:
    - { value: "3.1 oz", label: Weight }
    - { value: "94 × 63 × 31 mm", label: Case }
    - { value: "8–16 GB", label: SD card }
    - { value: "BLE · Wi-Fi · LAN", label: Networking }
  feature:
    title: Bluetooth to Wi-Fi IoT gateway
    text: MTH offers a powerful and cost-effective solution for large-scale low-power wireless deployments.
    image: metahub-2.png
  specs_intro: Real-time monitoring and management of IoT sensors and devices. APIs for rich IoT application development.
  specs_image: metahub-4.jpg
  specs:
    - { icon: feather, label: Weight, value: Ultra lightweight at just 3.1 oz }
    - { icon: clock, label: Synchronized timestamps, value: All data is timestamped for synchronization purposes }
    - { icon: zap, label: Power, value: Micro-USB power ensures the Hub works anywhere in the world }
    - { icon: droplet, label: Splash resistant, value: "Unibody, neat, dust-proof, hard and durable plastic case" }
    - { icon: shield, label: Regulatory compliance, value: "CE, FCC, IC, RoHS" }
    - { icon: layers, label: Supports multiple sensors, value: Add BLE-USB dongles to connect more MetaSensors to the Hub }
    - { icon: activity, label: Easy to use, value: Graph sensor data live with MetaBase }
    - { icon: power, label: Plug-n-play, value: Set up the apps and scripts to run specific commands on boot }
    - { icon: box, label: Small form factor, value: "PCB: 85.6 × 56 × 21 mm. Case: 94 × 63 × 31 mm" }
    - { icon: database, label: Memory, value: 8GB or 16GB SD card can store millions of sensor data entries }
    - { icon: bluetooth, label: Data transfer, value: Bluetooth Low Energy Smart® v4.0/5.0 }
    - { icon: users, label: Typical usage, value: Getting data from multiple MetaSensors at once or remote monitoring }
  sensors_title: Board specification
  sensors_intro: The gateway offers higher throughput, more capacity, and less interference, while providing easy management.
  sensors:
    - group: Hardware
      items:
        - name: Raspberry Pi
          rows: [[CPU, "Quad core 1.2 GHz Broadcom BCM2837 64-bit CPU (some model 2835), 700 MHz ARM1176JZF-S core CPU"], [Video, "Broadcom VideoCore IV GPU, HDMI"], [Audio, 3.5 mm jack or audio over HDMI], [Memory, 512MB RAM / 1GB RAM], [Storage, SD/MMC/SDIO], [Ethernet, 10/100 Ethernet (RJ45)], [I/Os, "4 USB 2 ports, 40-pin extended GPIO"], [Wireless, "BCM43438 wireless LAN, Bluetooth Low Energy (BLE)"]]
        - name: Power
          rows: [[Micro USB, "5 V @ 700 mA (up to 2.5 A)"]]
        - name: Peripherals
          rows: [[GPIOs, "8"], [UART, "1"], [I2C, "1"], [SPI, "1"], [Power, 3.3 V – 5 V], [Ground, 0 V]]
    - group: Software and enclosure
      items:
        - name: OS
          rows: [[Micro SD card, SanDisk 8GB or 16GB class 10 (or similar)], [Linux distro, Raspbian with MetaBase app (or similar)]]
        - name: Case
          rows: [[ABS plastic, Black or white], [Construction, Assembles 2 pieces with 4 screws]]
        - name: Usage
          rows: [[Linux mini computer, "Plug an LCD screen into the HDMI port and a keyboard and mouse into the USB ports, power up via the micro-USB to AC adapter, and use the MTH as a computer."]]
  develop_title: Powerful software
  develop:
    - The MetaBase app imports your data via Bluetooth into the device of your choice, and stores it. Use the app to configure the sensors at any frequency.
  gallery: [hub-1.jpg, hub-2.jpg]
