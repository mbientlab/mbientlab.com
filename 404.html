---
title: Page not found
permalink: /404.html
layout: default
sitemap: false
---
<section class="page-hero page-hero--center">
  <div class="container narrow center">
    <p class="eyebrow">404</p>
    <h1 class="page-hero__title">This page went out of range.</h1>
    <p class="page-hero__lead">The page you are looking for doesn't exist or has moved.</p>
    <div class="btn-row btn-row--center">
      <a class="btn btn--primary" href="{{ '/' | relative_url }}">Back to home</a>
      <a class="btn btn--ghost" href="{{ site.docs_url }}">Documentation</a>
    </div>
  </div>
</section>
<script>
  (function () {
    var exact = {{ site.data.redirects.exact | jsonify }};
    var prefix = {{ site.data.redirects.prefix | jsonify }};
    var base = {{ site.baseurl | jsonify }};
    var path = location.pathname;
    if (base && path.indexOf(base) === 0) path = path.slice(base.length);
    var key = path.toLowerCase().replace(/\/+$/, "") || "/";
    var target = exact[key];
    if (!target) {
      for (var p in prefix) {
        if (key.indexOf(p) === 0 || key + "/" === p) {
          target = prefix[p];
          if (target.slice(-1) === "*") target = target.slice(0, -1) + path.slice(p.length);
          break;
        }
      }
    }
    if (target) location.replace(/^https?:/.test(target) ? target : base + target);
  })();
</script>
