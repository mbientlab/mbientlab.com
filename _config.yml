title: MbientLab
tagline: Wearable wireless 9-axis IMUs and environmental sensors
description: >-
  Small wireless sensor development boards for prototyping, research and
  product development. Stream or log motion and environmental data over
  Bluetooth Low Energy.
url: "https://mbientlab.com"
baseurl: ""
lang: en-US
timezone: America/Los_Angeles
future: true

email: hello@mbientlab.com
address: Made in the USA, California.
docs_url: https://docs.mbientlab.com
github_url: https://github.com/mbientlab
app_store_url: https://apps.apple.com/us/app/metawear/id1547334547

logo: /assets/img/favicon.jpg
social:
  name: MbientLab
  links:
    - https://github.com/mbientlab
    - https://twitter.com/mbientLab
    - https://www.facebook.com/mbientLab/
    - https://www.instagram.com/mbientlab/

include: ["_pages"]
exclude: [vendor, tools, _scrape, README.md, Gemfile, Gemfile.lock]

permalink: /blog/:title/

sass:
  style: compressed
  sourcemap: never

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: page }
